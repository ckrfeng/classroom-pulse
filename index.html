<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Classroom Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0a0a0a;
            --ink-2: #5c5c5c;
            --paper: #ffffff;
            --tint: #f3f3f1;
            --tint-2: #e8e8e5;
            --chart: #1d5fbf;
            --up: #2e7d32;
            --down: #c4242a;
            --gutter: clamp(20px, 4vw, 48px);
            --band: #f3f3f1;
            --knob: #0a0a0a;
            --knob-notch: #ffffff;
        }

        html.dark {
            --ink: #f2f2f0;
            --ink-2: #a3a3a0;
            --paper: #121212;
            --tint: #1d1d1d;
            --tint-2: #2c2c2c;
            --chart: #6aa0ff;
            --up: #5cc27a;
            --down: #ff7a7a;
            --band: #181818;
            --knob: #2a2a2a;
            --knob-notch: #f2f2f0;
            color-scheme: dark;
        }
        .dial-track { stroke: var(--tint-2); }
        .dial-text { fill: var(--ink-2); }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font: 400 16px/1.5 "Geist", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums;
        }
        .hidden { display: none !important; }
        .opacity-0 { opacity: 0; }
        .translate-y-2 { transform: translateY(8px); }
        :focus-visible { outline: 2px solid var(--chart); outline-offset: 3px; }
        .mono { font-family: "Geist Mono", ui-monospace, monospace; }

        /* Header: a name and two words to switch screens */
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
            padding: 20px var(--gutter);
        }
        .name { font: 600 16px/1 "Geist", sans-serif; }
        .tabs { display: flex; gap: 24px; }
        .tab {
            padding: 4px 0; border: 0; background: none; color: var(--ink-2); cursor: pointer;
            font: 500 16px/1 "Geist", sans-serif; border-bottom: 2px solid transparent;
        }
        .tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

        /* Links that act: plain text, underlined */
        .link {
            padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer;
            font: 500 16px/1.2 "Geist", sans-serif; text-decoration: underline; text-underline-offset: 5px;
            text-decoration-thickness: 1.5px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            transition: color 120ms ease-out;
        }
        .link:hover { color: var(--chart); }
        .link.is-on { color: var(--chart); }
        .link:active { opacity: 0.6; }

        /* Teacher board */
        .board { padding: 0 var(--gutter) 56px; max-width: 1360px; margin: 0 auto; }
        .hero {
            display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 48px; align-items: end;
            padding: 24px 0 64px;
        }
        .join-code {
            margin: 0; font: 500 clamp(76px, 12vw, 164px)/0.9 "Geist Mono", ui-monospace, monospace;
            letter-spacing: 0.06em; color: var(--ink);
        }
        .join-hint { margin: 24px 0 0; color: var(--ink-2); font-size: 18px; max-width: 42ch; overflow-wrap: anywhere; }
        .join-hint span { color: var(--ink); font-family: "Geist Mono", ui-monospace, monospace; font-size: 15px; }
        .hero-actions { display: flex; gap: 24px; margin-top: 20px; }

        .count { text-align: right; }
        .count-num { font: 500 clamp(88px, 11vw, 150px)/0.9 "Geist", sans-serif; letter-spacing: -0.03em; }
        .count-note { margin: 12px 0 0; color: var(--ink-2); font-size: 18px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }

        .live-dot { position: relative; display: inline-block; width: 9px; height: 9px; border-radius: 999px; background: var(--up); flex: none; }
        .live-dot::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; background: inherit;
            animation: ping 1.8s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
        }
        .live-dot.bg-emerald-500 { background: var(--up); }
        .live-dot.bg-rose-500 { background: var(--down); }
        @keyframes ping { from { transform: scale(1); opacity: 0.6; } to { transform: scale(3); opacity: 0; } }

        .reading {
            display: grid; grid-template-columns: minmax(0, 560px) 260px; justify-content: center; gap: 72px; align-items: center;
            padding: 48px 0 0; background: var(--band); margin: 0 calc(var(--gutter) * -1); padding-left: var(--gutter); padding-right: var(--gutter);
            padding-top: 56px; padding-bottom: 56px;
        }
        .gauge-wrap { position: relative; width: 100%; aspect-ratio: 16 / 10; }
        .gauge-wrap canvas, .trend-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .score { display: flex; flex-direction: column; gap: 8px; width: 260px; }
        .score-num { font: 500 clamp(96px, 11vw, 160px)/0.9 "Geist", sans-serif; letter-spacing: -0.03em; }
        #sentiment-status-badge { font: 500 26px/1.2 "Geist", sans-serif; }
        .score-note { margin: 16px 0 0; color: var(--ink-2); font-size: 16px; max-width: 34ch; }

        .trend { padding: 56px 0 0; }
        .trend h2 { margin: 0; font: 500 22px/1.2 "Geist", sans-serif; }
        .trend p { margin: 6px 0 0; color: var(--ink-2); }
        .trend-wrap { position: relative; height: 240px; margin-top: 24px; }

        .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 40px; }
        .scenarios { display: flex; flex-wrap: wrap; gap: 12px 24px; width: 100%; padding-top: 8px; }

        /* Student dial: one column, no boxes */
        .student { max-width: 440px; margin: 0 auto; padding: 32px 22px 56px; }
        .join-card h2 { margin: 0; font: 500 34px/1.1 "Geist", sans-serif; letter-spacing: -0.02em; }
        .join-card p { margin: 10px 0 36px; color: var(--ink-2); font-size: 17px; }
        .join-card form { display: flex; flex-direction: column; gap: 24px; }
        .join-card input {
            width: 100%; padding: 8px 0 12px; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
            background: transparent; color: var(--ink); outline: none; text-align: center; text-transform: uppercase;
            font: 500 44px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.3em;
        }
        .join-card input:focus { border-bottom-color: var(--chart); }
        .join-card input::placeholder { color: var(--tint-2); }

        .btn-primary {
            display: flex; align-items: center; justify-content: center; width: 100%; height: 56px;
            border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); cursor: pointer;
            font: 500 17px/1 "Geist", sans-serif; touch-action: manipulation; transition: transform 120ms ease-out;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary:active { transform: scale(0.98); }

        .room-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .room-line .room-name { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 15px; }
        .room-line strong { font: 500 16px/1 "Geist Mono", ui-monospace, monospace; color: var(--ink); letter-spacing: 0.08em; }

        .feedback { text-align: center; padding: 40px 0 24px; }
        #student-value-display { display: inline-block; min-width: 3.4em; text-align: center; font: 500 128px/0.9 "Geist", sans-serif; letter-spacing: -0.04em; transition: color 450ms ease; }
        #student-label-display { margin-top: 14px; font: 500 20px/1.2 "Geist", sans-serif; color: var(--ink-2); }

        .dial { position: relative; width: min(260px, 72vw); aspect-ratio: 1; margin: 16px auto 0; }
        #dial-arc-active { transition: stroke 450ms ease; }
        #student-label-display { transition: color 450ms ease; }
        .dial > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .rotary-dial {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 56%; aspect-ratio: 1; border-radius: 999px; background: var(--knob); cursor: grab;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .rotary-dial:active { cursor: grabbing; }
        #rotary-indicator { position: absolute; inset: 0; border-radius: inherit; }
        .notch {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 24px; border-radius: 999px; background: var(--knob-notch);
        }
        .dial-label {
            position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
            font: 500 13px/1 "Geist", sans-serif; color: var(--ink-2);
        }

        .slider-ends { display: flex; justify-content: space-between; margin-bottom: 14px; color: var(--ink-2); font-size: 15px; }
        input[type=range].sentiment-slider { -webkit-appearance: none; appearance: none; width: 100%; margin: 0; background: transparent; cursor: pointer; }
        input[type=range].sentiment-slider::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--tint-2); }
        input[type=range].sentiment-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 30px; height: 30px; margin-top: -11px;
            border-radius: 50%; background: var(--ink); border: 0;
        }
        input[type=range].sentiment-slider::-moz-range-track { height: 8px; border-radius: 999px; background: var(--tint-2); }
        input[type=range].sentiment-slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); border: 0; }

        .presets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 28px; }
        .preset {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 62px;
            border: 0; border-radius: 12px; background: var(--tint); color: var(--ink); cursor: pointer;
            font: 500 17px/1 "Geist", sans-serif; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            transition: transform 120ms ease-out;
        }
        .preset small { font: 400 12px/1 "Geist", sans-serif; color: var(--ink-2); }
        .preset:active { transform: scale(0.96); }

        /* Toasts */
        #toast-container {
            position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none; max-width: min(360px, calc(100vw - 32px));
        }
        .toast {
            background: var(--ink); color: var(--paper); border-radius: 10px; padding: 12px 16px;
            font: 500 14px/1.4 "Geist", sans-serif; transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
        .toast--success { background: var(--up); }
        .toast--error { background: var(--down); }

        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; gap: 32px; }
            .count { text-align: left; }
            .count-note { justify-content: flex-start; }
            .reading { grid-template-columns: 1fr; gap: 40px; }
        }
        @media (max-width: 520px) {
            .tabs { gap: 18px; }
            .hero-actions { flex-wrap: wrap; gap: 16px 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('classroomPulse.theme');
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { /* storage blocked: follow the system */ }
        })();
    </script>
</head>
<body>

    <div id="toast-container"></div>

    <header class="topbar">
        <div class="name">Classroom Pulse</div>
        <nav class="tabs" aria-label="Screens">
            <button id="btn-mode-teacher" class="tab is-active" onclick="switchMode('teacher')">Board</button>
            <button id="btn-mode-student" class="tab" onclick="switchMode('student')">Dial</button>
            <button id="btn-theme-toggle" class="tab" onclick="toggleTheme()">Dark mode</button>
        </nav>
    </header>

    <!-- TEACHER BOARD -->
    <main id="view-teacher" class="board">

        <section class="hero">
            <div>
                <div id="teacher-room-code" class="join-code">----</div>
                <p id="join-hint-url" class="join-hint"></p>
                <div class="hero-actions">
                    <button class="link" onclick="copyStudentLink()">Copy join link</button>
                    <button class="link" onclick="generateNewRoom()">New code</button>
                </div>
            </div>
            <div class="count">
                <div id="active-student-count" class="count-num">0</div>
                <p class="count-note"><span id="live-indicator-dot" class="live-dot bg-emerald-500"></span><span><span id="active-student-label">Students</span> connected</span></p>
            </div>
        </section>

        <section class="reading">
            <div class="gauge-wrap"><canvas id="gauge-canvas"></canvas></div>
            <div class="score">
                <div id="gauge-numeric-readout" class="score-num">0</div>
                <div id="sentiment-status-badge">Neutral</div>
            </div>
        </section>

        <section class="trend">
            <h2>Last 60 seconds</h2>
            <div class="trend-wrap"><canvas id="worm-canvas"></canvas></div>
        </section>

        <section class="tools">
            <button id="btn-demo-toggle" class="link" onclick="toggleDemoMode()"><span id="demo-btn-text">Simulate a class</span></button>
            <button class="link" onclick="resetGraph()">Clear graph</button>
            <div id="demo-scenario-banner" class="hidden scenarios">
                <button class="link" onclick="setDemoScenario(-42, false)">Lots of homework</button>
                <button class="link" onclick="setDemoScenario(0, false)">A little homework</button>
                <button class="link" onclick="setDemoScenario(46, false)">No homework</button>
                <button class="link" onclick="setDemoScenario(10, true)">Normal discussion</button>
            </div>
        </section>
    </main>

    <!-- STUDENT DIAL -->
    <main id="view-student" class="hidden student">

        <section id="student-join-card" class="join-card">
            <h2>Join your class</h2>
            <form onsubmit="handleStudentJoin(event)">
                <input id="student-room-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" required aria-label="Room code">
                <button type="submit" class="btn-primary">Join</button>
            </form>
        </section>

        <section id="student-controller-card" class="hidden">
            <div class="room-line">
                <div class="room-name">Room <strong id="student-connected-room">----</strong></div>
                <button class="link" onclick="leaveStudentRoom()">Change room</button>
            </div>

            <div id="student-feedback-box" class="feedback">
                <div id="student-value-display">0</div>
                <div id="student-label-display">Neutral</div>
            </div>

            <div class="dial">
                <svg viewBox="0 0 200 200" aria-hidden="true">
                    <path class="dial-track" d="M 35 165 A 90 90 0 1 1 165 165" fill="none" stroke="#e8e8e5" stroke-width="10" stroke-linecap="round"/>
                    <path id="dial-arc-active" d="M 35 165 A 90 90 0 1 1 165 165" fill="none" stroke="#1d5fbf" stroke-width="10" stroke-linecap="round" stroke-dasharray="424" stroke-dashoffset="212"/>
                    <text class="dial-text" x="18" y="194" fill="#5c5c5c" font-size="11" font-weight="500">-50</text>
                    <text class="dial-text" x="95" y="14" fill="#5c5c5c" font-size="11" font-weight="500">0</text>
                    <text class="dial-text" x="166" y="194" fill="#5c5c5c" font-size="11" font-weight="500">+50</text>
                </svg>
                <div id="rotary-knob" class="rotary-dial">
                    <div id="rotary-indicator"><span class="notch"></span></div>
                    <span class="dial-label">Turn</span>
                </div>
            </div>

            <div style="margin-top: 36px;">
                <div class="slider-ends"><span>Dislike</span><span>Like</span></div>
                <input id="student-slider" type="range" min="-50" max="50" value="0" step="1" class="sentiment-slider" oninput="updateStudentSentiment(parseInt(this.value, 10))" aria-label="Your reaction, from dislike to like">
            </div>

            <div class="presets">
                <button class="preset" onclick="updateStudentSentiment(-50)">-50<small>Hate</small></button>
                <button class="preset" onclick="updateStudentSentiment(-25)">-25<small>Dislike</small></button>
                <button class="preset" onclick="updateStudentSentiment(0)">0<small>Neutral</small></button>
                <button class="preset" onclick="updateStudentSentiment(25)">+25<small>Like</small></button>
                <button class="preset" onclick="updateStudentSentiment(50)">+50<small>Love</small></button>
            </div>
        </section>
    </main>

    <!-- Application Logic (realtime votes via Firebase Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 0. FIREBASE CONFIG: paste your web app config here (see setup steps)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQbTHM4R9DDrNjPpj3gYiWlIUxz3FWI4k",
            authDomain: "classroom-pulse-956b7.firebaseapp.com",
            projectId: "classroom-pulse-956b7",
            storageBucket: "classroom-pulse-956b7.firebasestorage.app",
            messagingSenderId: "716499717481",
            appId: "1:716499717481:web:1f7d68206d702576d241f8"
        };

        const VOTE_STALE_MS = 120000;  // ignore votes older than 2 min (closed tabs)
        const HEARTBEAT_MS = 25000;    // student re-sends their vote to stay fresh
        const VOTE_THROTTLE_MS = 300;  // min gap between vote writes while dragging

        // =========================================================================
        // 1. GLOBAL STATE
        // =========================================================================
        let currentMode = 'teacher'; // 'teacher' | 'student'
        let roomCode = '';           // room this teacher board is showing
        let isDemoMode = false;
        let demoBias = 0; // Target bias for demo mode (-50 to +50)
        let demoWaveActive = false;
        let demoCurrent = 0;

        // Live votes for the teacher board: studentUid -> { val, updatedAt }
        let liveParticipants = new Map();
        let targetAverage = 0;
        let smoothedNeedleValue = 0;
        let activeCount = 0;

        // 60-Second Scrolling History Buffer (sampled every 1000ms = 60 points)
        const MAX_HISTORY_POINTS = 60;
        const SAMPLE_INTERVAL_MS = 1000;
        let historyData = []; // Array of { time: number, value: number }

        // Student state
        let studentSentiment = 0;
        let studentRoomCode = null;  // room being joined or already joined
        let studentJoined = false;
        let lastSyncTimestamp = 0;
        let pendingSyncTimeout = null;
        let heartbeatInterval = null;

        // Firebase state
        let db = null;
        let myUid = null;
        let firebaseReady = false;
        let unsubscribeRoom = null;
        let markAuthReady;
        const authReady = new Promise((resolve) => { markAuthReady = resolve; });

        const HOST_ROOM_KEY = 'classroomPulse.hostRoom';

        // Theme Toggle
        function syncThemeLabel() {
            const btn = document.getElementById('btn-theme-toggle');
            if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? 'Light mode' : 'Dark mode';
        }
        window.toggleTheme = function() {
            const isDarkNow = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('classroomPulse.theme', isDarkNow ? 'dark' : 'light'); } catch (e) { /* storage blocked */ }
            syncThemeLabel();
            resizeCanvases();
        };

        function storageGet(key) {
            try { return sessionStorage.getItem(key); } catch (e) { return null; }
        }
        function storageSet(key, value) {
            try { sessionStorage.setItem(key, value); } catch (e) { /* storage blocked: fine */ }
        }

        function clampVal(n) {
            return Math.max(-50, Math.min(50, Math.round(n)));
        }

        // =========================================================================
        // 2. FIREBASE CONNECTION
        // =========================================================================
        async function initFirebase() {
            const isConfigured = !Object.values(firebaseConfig).some((v) => String(v).startsWith('PASTE_'));
            if (!isConfigured) {
                setConnectionState(false);
                showToast('Firebase is not set up yet. Paste your config into the page (see setup steps).', 'error');
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                const cred = await signInAnonymously(auth);
                myUid = cred.user.uid;
                firebaseReady = true;
                markAuthReady();
                setConnectionState(true);
                if (currentMode === 'teacher') subscribeToRoom(roomCode);
            } catch (err) {
                console.error('Firebase error:', err);
                setConnectionState(false);
                showToast('Could not connect to Firebase. Check your config and Anonymous sign-in.', 'error');
            }
        }

        function setConnectionState(connected) {
            document.querySelectorAll('.live-dot').forEach((dot) => {
                dot.classList.toggle('bg-emerald-500', connected);
                dot.classList.toggle('bg-rose-500', !connected);
            });
        }

        // =========================================================================
        // 3. ROUTING & MODE MANAGEMENT
        // =========================================================================
        function handleInitialRoute() {
            const params = new URLSearchParams(window.location.search);
            const urlMode = params.get('mode');
            const urlRoom = params.get('room');
            const isValidCode = (code) => /^[A-Za-z]{4}$/.test(code || '');

            if (urlMode === 'student') {
                switchMode('student');
                if (isValidCode(urlRoom)) {
                    connectStudentToRoom(urlRoom.toUpperCase());
                }
            } else {
                const startCode = isValidCode(urlRoom)
                    ? urlRoom.toUpperCase()
                    : (storageGet(HOST_ROOM_KEY) || generateRandomCode());
                setRoomCode(startCode);
                switchMode('teacher');
            }
        }

        window.switchMode = function(mode) {
            currentMode = mode;
            const teacherView = document.getElementById('view-teacher');
            const studentView = document.getElementById('view-student');
            const btnTeacher = document.getElementById('btn-mode-teacher');
            const btnStudent = document.getElementById('btn-mode-student');

            if (mode === 'teacher') {
                teacherView.classList.remove('hidden');
                studentView.classList.add('hidden');
                btnTeacher.classList.add('is-active');
                btnStudent.classList.remove('is-active');

                if (!roomCode) setRoomCode(storageGet(HOST_ROOM_KEY) || generateRandomCode());
                subscribeToRoom(roomCode);
                resizeCanvases();
            } else {
                teacherView.classList.add('hidden');
                studentView.classList.remove('hidden');
                btnStudent.classList.add('is-active');
                btnTeacher.classList.remove('is-active');

                // Pre-fill room code if this board is showing one
                const input = document.getElementById('student-room-input');
                if (!input.value && roomCode) {
                    input.value = roomCode;
                }
            }
        };

        function generateRandomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // Omitted I and O to avoid confusion with 1 and 0
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function setRoomCode(code) {
            roomCode = code;
            document.getElementById('teacher-room-code').textContent = code;
            storageSet(HOST_ROOM_KEY, code);
            updateJoinHintUrl();
        }

        // Base address students open: the site the teacher is currently on
        function getStudentBaseUrl() {
            if (location.protocol === 'file:') return null;
            return location.origin + '/';
        }

        function updateJoinHintUrl() {
            const hintEl = document.getElementById('join-hint-url');
            const base = getStudentBaseUrl();
            if (!base) {
                hintEl.innerHTML = '';
                return;
            }
            hintEl.innerHTML = `Join link: <span class="text-indigo-600 dark:text-indigo-300 font-mono">${base}?mode=student&room=${roomCode}</span>`;
        }

        window.generateNewRoom = function() {
            resetGraph();
            liveParticipants.clear();
            setRoomCode(generateRandomCode());
            subscribeToRoom(roomCode);
            showToast(`Created new room code: ${roomCode}`, 'info');
        };

        window.copyStudentLink = async function() {
            const base = getStudentBaseUrl();
            if (!base) {
                showToast('Open this page through a web address first.', 'error');
                return;
            }
            const shareUrl = `${base}?mode=student&room=${roomCode}`;

            try {
                await navigator.clipboard.writeText(shareUrl);
            } catch (err) {
                // Clipboard API needs a secure context; fall back to a temporary input
                const tempInput = document.createElement('input');
                tempInput.value = shareUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
            }

            showToast(`Copied link: ?mode=student&room=${roomCode}`, 'success');
        };

        // =========================================================================
        // 4. TEACHER BOARD: LISTEN FOR VOTES IN THE ROOM
        // =========================================================================
        function subscribeToRoom(code) {
            if (unsubscribeRoom) {
                unsubscribeRoom();
                unsubscribeRoom = null;
            }
            liveParticipants.clear();
            if (!firebaseReady || !db) return;

            // Mark the room as open so students can check the code
            setDoc(doc(db, 'rooms', code), { openedAt: Date.now() }, { merge: true })
                .catch((err) => console.error('Could not open room:', err));

            unsubscribeRoom = onSnapshot(collection(db, 'rooms', code, 'votes'), (snapshot) => {
                const now = Date.now();
                liveParticipants.clear();
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (typeof data.val === 'number' && typeof data.updatedAt === 'number'
                        && now - data.updatedAt <= VOTE_STALE_MS) {
                        liveParticipants.set(docSnap.id, { val: clampVal(data.val), updatedAt: data.updatedAt });
                    }
                });
            }, (err) => {
                console.error('Room listener error:', err);
                showToast('Lost the live feed from Firebase. Check the Firestore rules.', 'error');
            });
        }

        // =========================================================================
        // 5. STUDENT DIAL: JOIN A ROOM & SEND VOTES
        // =========================================================================
        window.handleStudentJoin = function(e) {
            e.preventDefault();
            const raw = document.getElementById('student-room-input').value.trim().toUpperCase();
            if (raw.length !== 4) {
                showToast('Please enter a 4-letter room code.', 'error');
                return;
            }
            connectStudentToRoom(raw);
        };

        async function connectStudentToRoom(code) {
            studentRoomCode = code;
            studentJoined = false;
            document.getElementById('student-room-input').value = code;
            setStudentView(false);

            await authReady;
            if (studentRoomCode !== code) return; // student changed rooms while waiting

            try {
                const roomSnap = await getDoc(doc(db, 'rooms', code));
                if (studentRoomCode !== code) return;
                if (!roomSnap.exists()) {
                    studentRoomCode = null;
                    showToast(`No live session with code ${code}. Check the code with your teacher.`, 'error');
                    return;
                }
            } catch (err) {
                console.error('Join check failed:', err);
                studentRoomCode = null;
                showToast('Could not reach the room. Check your connection.', 'error');
                return;
            }

            studentJoined = true;
            document.getElementById('student-connected-room').textContent = code;
            setStudentView(true);
            sendVote(studentSentiment); // announce presence with the current dial value
            startHeartbeat();
            showToast(`Connected to Room ${code}`, 'success');
        }

        function setStudentView(joined) {
            document.getElementById('student-join-card').classList.toggle('hidden', joined);
            document.getElementById('student-controller-card').classList.toggle('hidden', !joined);
        }

        function sendVote(val) {
            if (!db || !myUid || !studentJoined || !studentRoomCode) return;
            setDoc(doc(db, 'rooms', studentRoomCode, 'votes', myUid), { val, updatedAt: Date.now() })
                .catch((err) => console.error('Vote not saved:', err));
        }

        function removeMyVote() {
            if (!db || !myUid || !studentRoomCode) return;
            deleteDoc(doc(db, 'rooms', studentRoomCode, 'votes', myUid))
                .catch((err) => console.error('Could not remove vote:', err));
        }

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => sendVote(studentSentiment), HEARTBEAT_MS);
        }

        window.leaveStudentRoom = function() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            if (studentJoined) removeMyVote();
            studentRoomCode = null;
            studentJoined = false;
            setStudentView(false);
        };

        // Best effort: remove the vote when the student closes the tab
        window.addEventListener('pagehide', () => {
            if (studentJoined) removeMyVote();
        });

        // Throttled write (~300ms) when student drags dial/slider
        function scheduleStudentSync(val) {
            const now = Date.now();
            const elapsed = now - lastSyncTimestamp;

            if (elapsed >= VOTE_THROTTLE_MS) {
                lastSyncTimestamp = now;
                sendVote(val);
            } else {
                if (pendingSyncTimeout) clearTimeout(pendingSyncTimeout);
                pendingSyncTimeout = setTimeout(() => {
                    lastSyncTimestamp = Date.now();
                    sendVote(studentSentiment);
                }, VOTE_THROTTLE_MS - elapsed);
            }
        }

        // =========================================================================
        // 5. TEACHER CONTROLS: DEMO SIMULATOR, CLEAR GRAPH
        // =========================================================================
        window.toggleDemoMode = function() {
            isDemoMode = !isDemoMode;
            const btn = document.getElementById('btn-demo-toggle');
            const btnText = document.getElementById('demo-btn-text');
            const banner = document.getElementById('demo-scenario-banner');

            if (isDemoMode) {
                btn.classList.toggle('is-on', isDemoMode);
                btnText.textContent = "Stop Simulation";
                banner.classList.remove('hidden');
                demoBias = 0;
                demoWaveActive = false;
                demoCurrent = 0;
                showToast('Demo Mode Active: Simulating 24 live student dials', 'info');
            } else {
                btn.classList.toggle('is-on', isDemoMode);
                btnText.textContent = "Simulate Class (Demo)";
                banner.classList.add('hidden');
                showToast('Demo Mode Stopped', 'info');
            }
        };

        window.setDemoScenario = function(bias, gentleWave = false) {
            demoBias = bias;
            demoWaveActive = gentleWave;
        };

        window.resetGraph = function() {
            historyData = [];
            smoothedNeedleValue = 0;
            targetAverage = 0;
            demoBias = 0;
            demoWaveActive = false;
            demoCurrent = 0;
        };

        // =========================================================================
        // 6. STUDENT TACTILE ROTARY DIAL & SLIDER INTERACTION
        // =========================================================================
        window.updateStudentSentiment = function(val, skipSync = false) {
            val = Math.max(-50, Math.min(50, Math.round(val)));
            studentSentiment = val;

            // Sync range slider
            const slider = document.getElementById('student-slider');
            if (slider) slider.value = val;

            // Rotate knob (-135deg at -50, 0deg at 0, +135deg at +50)
            const angle = (val / 50) * 135;
            const indicator = document.getElementById('rotary-indicator');
            if (indicator) {
                indicator.style.transform = `rotate(${angle}deg)`;
            }

            // Update SVG progress arc (total length ~424, midpoint 212)
            const arc = document.getElementById('dial-arc-active');
            if (arc) {
                const offset = 212 - (val / 50) * 212;
                arc.style.strokeDashoffset = offset;
                arc.style.stroke = getSentimentColor(val);
            }

            // Update digital readout & color badges
            const displayVal = document.getElementById('student-value-display');
            const displayLabel = document.getElementById('student-label-display');
            const box = document.getElementById('student-feedback-box');

            if (displayVal && displayLabel && box) {
                displayVal.textContent = val > 0 ? `+${val}` : `${val}`;
                const color = getSentimentColor(val);
                displayVal.style.color = color;
                displayLabel.style.color = color;
                displayLabel.textContent = getSentimentLabel(val);
                box.style.borderColor = val === 0 ? '' : color;
            }

            if (!skipSync) {
                scheduleStudentSync(val);
            }
        };

        // Touch & Mouse Rotary Knob Dragging Logic
        function setupRotaryKnob() {
            const knob = document.getElementById('rotary-knob');
            if (!knob) return;

            let isDragging = false;

            function handlePointerMove(clientX, clientY) {
                const rect = knob.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = clientX - centerX;
                const dy = clientY - centerY;

                // Angle in degrees where 0 is straight up (12 o'clock)
                let deg = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
                if (deg > 180) deg -= 360;

                // Clamp rotation between -135 and +135 degrees
                deg = Math.max(-135, Math.min(135, deg));
                const mappedValue = Math.round((deg / 135) * 50);
                updateStudentSentiment(mappedValue);
            }

            knob.addEventListener('mousedown', (e) => {
                isDragging = true;
                handlePointerMove(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                handlePointerMove(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            knob.addEventListener('touchstart', (e) => {
                isDragging = true;
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        // =========================================================================
        // 7. AGGREGATION ENGINE & CANVAS RENDERING (GAUGE + 60s WORM CHART)
        // =========================================================================
        function getSentimentColor(val) {
            const dark = document.documentElement.classList.contains('dark');
            if (val <= -6) return dark ? '#ff6b6b' : '#e5484d';   // dislike: red
            if (val < 6) return dark ? '#6aa0ff' : '#1d5fbf';     // neutral: blue
            return dark ? '#3ddc84' : '#2fa35f';                  // like: green
        }

        function getSentimentLabel(val) {
            if (val <= -35) return 'Strongly Dislike';
            if (val <= -10) return 'Dislike';
            if (val < 10) return 'Neutral';
            if (val < 35) return 'Like';
            return 'Strongly Like';
        }

        // Sample class average every 1000ms (1 Hz) for the 60-second scrolling worm chart
        setInterval(() => {
            if (currentMode !== 'teacher') return;

            const now = Date.now();
            const STALE_THRESHOLD_MS = 120000; // Prune inactive > 2 minutes

            if (isDemoMode) {
                const wave = demoWaveActive
                    ? Math.sin(now / 1500) * 8 + Math.cos(now / 800) * 4
                    : Math.sin(now / 1800) * 2.5;
                demoCurrent += ((demoBias + wave) - demoCurrent) * 0.45;
                targetAverage = Math.max(-50, Math.min(50, demoCurrent));
                activeCount = 24;
            } else {
                let sum = 0;
                let count = 0;
                liveParticipants.forEach((entry, uid) => {
                    if (now - entry.updatedAt <= STALE_THRESHOLD_MS) {
                        sum += entry.val;
                        count++;
                    } else {
                        liveParticipants.delete(uid);
                    }
                });
                activeCount = count;
                targetAverage = count > 0 ? (sum / count) : 0;
            }

            // Update Participant Counter UI
            const countEl = document.getElementById('active-student-count');
            const labelEl = document.getElementById('active-student-label');
            if (countEl) countEl.textContent = activeCount;
            if (labelEl) labelEl.textContent = activeCount === 1 ? 'Student' : 'Students';

            // Append point to 60-second history
            historyData.push({ time: now, value: targetAverage });
            if (historyData.length > MAX_HISTORY_POINTS) {
                historyData.shift();
            }
        }, SAMPLE_INTERVAL_MS);

        // Eases the score colour toward its target, so it morphs between red, blue and green
        let gaugeColorHex = '#1d5fbf';
        let gaugeColorRgb = null;
        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgbToHex(rgb) {
            return '#' + rgb.map((c) => Math.round(c).toString(16).padStart(2, '0')).join('');
        }
        function updateGaugeColor(val) {
            const target = hexToRgb(getSentimentColor(val));
            if (!gaugeColorRgb) gaugeColorRgb = target;
            gaugeColorRgb = gaugeColorRgb.map((c, i) => c + (target[i] - c) * 0.08);
            gaugeColorHex = rgbToHex(gaugeColorRgb);
        }

        // High-FPS Render Loop for silky-smooth needle & worm graph
        function renderLoop() {
            if (currentMode === 'teacher') {
                // Smoothly interpolate needle toward targetAverage
                smoothedNeedleValue += (targetAverage - smoothedNeedleValue) * 0.14;
                updateGaugeColor(smoothedNeedleValue);

                updateTeacherReadouts(smoothedNeedleValue);
                drawGaugeCanvas(smoothedNeedleValue);
                drawWormCanvas();
            }
            requestAnimationFrame(renderLoop);
        }

        function updateTeacherReadouts(val) {
            const rounded = Math.round(val);
            const readoutEl = document.getElementById('gauge-numeric-readout');
            const badgeEl = document.getElementById('sentiment-status-badge');
            const color = gaugeColorHex;

            if (readoutEl) {
                readoutEl.textContent = rounded > 0 ? `+${rounded}` : `${rounded}`;
                readoutEl.style.color = color;
            }
            if (badgeEl) {
                badgeEl.textContent = getSentimentLabel(val);
                badgeEl.style.color = color;
                badgeEl.style.borderColor = color;
            }
        }

        // Draw Semi-Circular Analog Focus-Group Gauge
        function drawGaugeCanvas(val) {
            const canvas = document.getElementById('gauge-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
                canvas.width = Math.floor(rect.width * dpr);
                canvas.height = Math.floor(rect.height * dpr);
            }

            const isDark = document.documentElement.classList.contains('dark');

            ctx.save();
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h * 0.88;
            const radius = Math.min(w * 0.43, h * 0.76);
            const arcWidth = Math.max(18, radius * 0.16);

            // Background Track Arc
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, 2 * Math.PI, false);
            ctx.lineWidth = arcWidth;
            ctx.strokeStyle = isDark ? 'rgba(244, 241, 234, 0.12)' : '#eeeeee';
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Value arc: the score filled in the chart hue, from -50 up to the current value
            const arcEnd = Math.PI + ((Math.max(-50, Math.min(50, val)) + 50) / 100) * Math.PI;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, Math.PI, arcEnd, false);
            ctx.lineWidth = arcWidth;
            ctx.strokeStyle = gaugeColorHex;
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Tick Marks (-50 to +50 in steps of 10)
            for (let v = -50; v <= 50; v += 10) {
                if (v === 0) continue; // no tick at neutral
                const ratio = (v + 50) / 100; // 0 to 1
                const theta = Math.PI + ratio * Math.PI;
                const innerR = radius - arcWidth * 0.75;
                const outerR = radius + arcWidth * 0.75;

                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(theta) * innerR, cy + Math.sin(theta) * innerR);
                ctx.lineTo(cx + Math.cos(theta) * outerR, cy + Math.sin(theta) * outerR);
                ctx.lineWidth = v === 0 ? 3 : 1.5;
                ctx.strokeStyle = v === 0
                    ? (isDark ? '#ffffff' : '#0a0a0a')
                    : (isDark ? 'rgba(148, 163, 184, 0.45)' : 'rgba(100, 116, 139, 0.45)');
                ctx.stroke();
            }

            // Needle Angle (-50 -> PI, 0 -> 1.5*PI, +50 -> 2*PI)
            const clamped = Math.max(-50, Math.min(50, val));
            const needleAngle = Math.PI + ((clamped + 50) / 100) * Math.PI;
            const needleLen = radius - arcWidth * 0.15;

            // Needle Drop Shadow
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(needleAngle);

            ctx.shadowColor = isDark ? 'rgba(0, 0, 0, 0.65)' : 'rgba(15, 23, 42, 0.35)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;

            // Tapered Broadcast Needle
            ctx.beginPath();
            ctx.moveTo(-12, -5);
            ctx.lineTo(needleLen, 0);
            ctx.lineTo(-12, 5);
            ctx.closePath();
            ctx.fillStyle = isDark ? '#ffffff' : '#0a0a0a';
            ctx.fill();
            ctx.restore();

            // Center Pivot Hub
            ctx.beginPath();
            ctx.arc(cx, cy, Math.max(12, radius * 0.09), 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#0a0a0a' : '#ffffff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = gaugeColorHex;
            ctx.stroke();

            ctx.restore();
        }

        // Draw Real-Time 60-Second Scrolling "Worm" Line Graph
        function drawWormCanvas() {
            const canvas = document.getElementById('worm-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
                canvas.width = Math.floor(rect.width * dpr);
                canvas.height = Math.floor(rect.height * dpr);
            }

            const isDark = document.documentElement.classList.contains('dark');

            ctx.save();
            ctx.scale(dpr, dpr);
            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            const padLeft = 38;
            const padRight = 18;
            const padTop = 18;
            const padBottom = 24;
            const plotW = w - padLeft - padRight;
            const plotH = h - padTop - padBottom;
            const zeroY = padTop + plotH / 2;

            // Subtle Background Tint Zones (Top Green, Bottom Red)
            ctx.fillStyle = 'rgba(16, 185, 129, 0.05)';
            ctx.fillRect(padLeft, padTop, plotW, plotH / 2);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.05)';
            ctx.fillRect(padLeft, zeroY, plotW, plotH / 2);

            // Horizontal Gridlines (+50, +25, 0, -25, -50)
            const levels = [50, 25, 0, -25, -50];
            ctx.font = '600 11px "JetBrains Mono", monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            levels.forEach((lvl) => {
                const y = zeroY - (lvl / 50) * (plotH / 2);
                ctx.beginPath();
                ctx.moveTo(padLeft, y);
                ctx.lineTo(padLeft + plotW, y);

                if (lvl === 0) {
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.65)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                } else {
                    ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.14)' : 'rgba(100, 116, 139, 0.18)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([]);
                }
                ctx.stroke();

                ctx.fillStyle = lvl === 0 ? (isDark ? '#cbd5e1' : '#334155') : '#64748b';
                ctx.fillText(lvl > 0 ? `+${lvl}` : `${lvl}`, padLeft - 8, y);
            });
            ctx.setLineDash([]);

            // Time Axis Labels (-60s to Now)
            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b';
            ctx.font = '600 10px "Inter", sans-serif';
            ctx.fillText('-60s', padLeft, h - 8);
            ctx.fillText('-30s', padLeft + plotW / 2, h - 8);
            ctx.fillText('LIVE', padLeft + plotW, h - 8);

            if (historyData.length < 2) {
                ctx.restore();
                return;
            }

            // Build Smooth Path across the 60-second window
            const stepX = plotW / (MAX_HISTORY_POINTS - 1);
            const startIndexOffset = MAX_HISTORY_POINTS - historyData.length;

            // Vertical Gradient Stroke matching sentiment zones
            const lineGrad = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
            lineGrad.addColorStop(0.0, '#3DDC97');
            lineGrad.addColorStop(0.42, '#8BE8C4');
            lineGrad.addColorStop(0.5, '#A7B0C4');
            lineGrad.addColorStop(0.58, '#FFA552');
            lineGrad.addColorStop(1.0, '#FF6F59');

            ctx.beginPath();
            let lastX = 0;
            let lastY = zeroY;

            historyData.forEach((pt, idx) => {
                const x = padLeft + (startIndexOffset + idx) * stepX;
                const y = zeroY - (pt.value / 50) * (plotH / 2);
                if (idx === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                lastX = x;
                lastY = y;
            });

            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = isDark ? '#6aa0ff' : '#1d5fbf';
            ctx.stroke();

            // Glowing Live Head Dot at the right edge of the worm
            const headColor = gaugeColorHex;
            ctx.beginPath();
            ctx.arc(lastX, lastY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = headColor;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = isDark ? '#ffffff' : '#0a0a0a';
            ctx.stroke();

            ctx.restore();
        }

        function resizeCanvases() {
            drawGaugeCanvas(smoothedNeedleValue);
            drawWormCanvas();
        }

        // =========================================================================
        // 8. UI HELPERS (CUSTOM TOASTS)
        // =========================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'toast--success',
                error: 'toast--error',
                info: 'toast--info'
            };

            toast.className = `toast ${colors[type] || colors.info} translate-y-2 opacity-0`;
            toast.textContent = message;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // =========================================================================
        // 9. BOOTSTRAP APPLICATION
        // =========================================================================
        window.addEventListener('resize', resizeCanvases);
        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            syncThemeLabel();
            setupRotaryKnob();
            initFirebase();
            handleInitialRoute();
            requestAnimationFrame(renderLoop);
        });
    </script>
</body>
</html>
